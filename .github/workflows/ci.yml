name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [gitea, juice-shop]
    name: test (${{ matrix.product }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platform/${{ matrix.product }} exec playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: pnpm env:up
      - run: pnpm --filter @platform/${{ matrix.product }} test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.product }}
          path: products/${{ matrix.product }}/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.product }}
          path: products/${{ matrix.product }}/allure-results/
          retention-days: 14

  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results
      - run: pnpm exec allure generate allure-results
      - uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: allure-report/
  deploy-report:
    needs: report
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4