name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [gitea, juice-shop]
    name: test (${{ matrix.product }})
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: bash scripts/setup-env.sh

      - name: Build test image
        run: docker build -t automation-platform-tests .

      - name: Run tests in container
        run: >
          docker run --name tests --network host --env-file .env
          automation-platform-tests
          pnpm --filter @platform/${{ matrix.product }} test

      - name: Copy reports out of container
        if: ${{ !cancelled() }}
        run: |
          docker cp tests:/app/products/${{ matrix.product }}/playwright-report products/${{ matrix.product }}/
          docker cp tests:/app/products/${{ matrix.product }}/allure-results products/${{ matrix.product }}/

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.product }}
          path: products/${{ matrix.product }}/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.product }}
          path: products/${{ matrix.product }}/allure-results/
          retention-days: 14
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/asa-halperin/automation-platform-tests:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Build test image
        run: docker build -t automation-platform-tests .

      - name: Scan image for secrets
        # Base image (Playwright) ships an npm cache with an expired
        # Azure SAS download token from Microsoft's own build. Not ours,
        # cannot be removed from that layer. Our own npm cache is deleted
        # in the same RUN that creates it.
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ runner.temp }}/trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.76.2 image
          --scanners secret --skip-dirs /root/.npm
          --exit-code 1 automation-platform-tests

      - name: Fail on fixable critical vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ runner.temp }}/trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.76.2 image
          --scanners vuln --severity CRITICAL --ignore-unfixed
          --exit-code 1 automation-platform-tests

      - name: Report high vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ runner.temp }}/trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.76.2 image
          --scanners vuln --severity HIGH
          --exit-code 0 automation-platform-tests

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          docker tag automation-platform-tests $IMAGE
          docker push $IMAGE

  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results
      - run: pnpm exec allure generate allure-results
      - uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: allure-report/
  deploy-report:
    needs: report
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4