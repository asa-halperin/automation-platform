name: chaos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

jobs:
  padel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [calm, flaky, broken]
    env:
      FAULT_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false

      - run: cp .env.example .env

      - name: Start padel with the fault profile
        run: |
          docker compose up -d --build padel
          timeout 120 bash -c 'until curl -sf http://localhost:3002/health > /dev/null; do sleep 2; done'

      - name: Build tests image
        run: docker build -t tests .

      - name: Run padel tests
        run: docker run --name tests --network host --env-file .env tests pnpm --filter @platform/padel test --retries=2

      - name: Copy reports out of the container
        if: ${{ !cancelled() }}
        run: |
          docker cp tests:/app/products/padel/playwright-report ./playwright-report
          docker cp tests:/app/products/padel/allure-results ./allure-results

      - name: Summarize results
        if: ${{ !cancelled() }}
        run: |
          docker cp tests:/app/products/padel/results.json ./results.json
          node scripts/chaos-summary.ts results.json > summary-${{ matrix.profile }}.json
          cat summary-${{ matrix.profile }}.json

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: chaos-${{ matrix.profile }}-playwright-report
          path: playwright-report

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: chaos-${{ matrix.profile }}-allure-results
          path: allure-results

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: summary-${{ matrix.profile }}
          path: summary-${{ matrix.profile }}.json