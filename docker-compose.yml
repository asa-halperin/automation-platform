services:
  juice-shop:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"

  gitea:
    image: gitea/gitea:1.24
    ports:
      - "3001:3000"
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__security__INSTALL_LOCK=true